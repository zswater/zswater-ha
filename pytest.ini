[pytest]
testpaths = tests
# Home Assistant's own test suite runs pytest-asyncio in auto mode; the config
# flow tests need the same so the `hass` fixture and async tests line up.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# pytest-homeassistant-custom-component installs pytest-socket, which blocks the
# socketpair asyncio's event loop creates during startup. On Linux that uses an
# AF_UNIX pair, but on Windows the ProactorEventLoop needs an AF_INET one, so the
# suite cannot start without this. No test here talks to the network: the client
# is faked in every one.
addopts = -p no:socket
filterwarnings =
    ignore::DeprecationWarning
