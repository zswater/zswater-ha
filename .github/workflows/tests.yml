name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One interpreter deliberately: the harness pins the Home Assistant
        # version under test, so a second Python version would test the same
        # Home Assistant twice rather than widen coverage.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Without this, setup-python looks for requirements.txt/pyproject.toml
          # at the repo root, finds neither, and fails the step immediately.
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -q
