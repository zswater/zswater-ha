name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One interpreter deliberately: the harness pins the Home Assistant
        # version under test, so a second Python version would test the same
        # Home Assistant twice rather than widen coverage.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Without this, setup-python looks for requirements.txt/pyproject.toml
          # at the repo root, finds neither, and fails the step immediately.
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Report failures as annotations
        # Job logs require authentication to download; check annotations do not.
        # Without this a failing run only says "exit code 1" from the outside,
        # which is not enough to act on.
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)|^E " pytest-output.txt | head -25 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done
          exit 1
